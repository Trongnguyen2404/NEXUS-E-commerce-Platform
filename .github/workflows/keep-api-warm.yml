name: Wake the API for the day

# Waking the free instance and keeping it awake are two different jobs, and one
# tool cannot do both.
#
#   * Waking needs a client that will hold the connection for the whole ~42s
#     cold start. Free uptime pingers cap their request timeout well below that
#     — cron-job.org stops at 30s — so they never see the boot finish, and the
#     service goes back to sleep having served nobody.
#   * Keeping it awake needs punctuality, not patience: a request at least every
#     15 minutes, which is exactly what those pingers are good at.
#
# So this workflow does the first job only. It fires once in the early morning,
# waits as long as the instance needs, and then gets out of the way; the pinger
# takes over for the rest of the day.
#
# It calls /health/live on purpose — that route does not query the database.
# /health and /health/ready both do, and holding a free Postgres compute open
# all day would exhaust its monthly allowance long before the month ended.
#
# Two honest caveats:
#   * GitHub throttles frequent schedules hard. The earlier version of this file
#     asked for every 10 minutes and was granted roughly every 3 to 10 hours.
#     Once-a-day runs are treated far better, but "best effort" still means a
#     slot can slip, which is why the two schedules below aim an hour early.
#   * GitHub disables scheduled workflows after 60 days with no repo activity.
#     On a repo that stops being touched, this quietly stops running.

on:
  schedule:
    # 22:00 and 23:00 UTC — 05:00 and 06:00 in UTC+7. Both aim well ahead of the
    # 07:00 window so a slipped slot still lands before anyone visits. Whichever
    # one runs first pays the cold start; the other then costs a 0.3s round trip.
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: keep-api-warm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wake:
    name: Wake the instance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Wake the API
        env:
          # Public URL, nothing secret. Override with a repository variable if
          # the service is ever renamed.
          API_BASE: ${{ vars.API_BASE_URL || 'https://nexus-e-commerce-platform.onrender.com' }}
        run: |
          set -uo pipefail
          url="$API_BASE/api/v1/health/live"

          for attempt in $(seq 1 6); do
            started=$(date +%s)

            # A cold instance answers 503 from the edge while it boots, and only
            # a client still connected at the end gets the 200. Two minutes is
            # roughly triple the measured cold start, so a slow boot still wins.
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
                     --max-time 120 "$url" || echo 000)

            echo "attempt $attempt -> HTTP $code after $(( $(date +%s) - started ))s"

            if [ "$code" = "200" ]; then
              echo "awake: $(cat /tmp/body.txt)"
              exit 0
            fi

            # Give the instance room to finish a boot this attempt kicked off
            # before knocking again.
            [ "$attempt" -lt 6 ] && sleep 45
          done

          echo "::error::$url never returned 200 after six attempts"
          exit 1
