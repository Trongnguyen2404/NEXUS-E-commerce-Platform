name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_ci
        ports:
          - 5432:5432
        # Without this the job races the container and the first query fails.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_ci?schema=public
      # Values only need to exist for the app to boot; they are not real secrets.
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # `npm ci` triggers postinstall -> prisma generate
      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed
        run: npm run seed

      - run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit tests
        run: npm test -- --ci --runInBand

      - run: npm run build

      - name: Boot the compiled app and hit /health
        run: |
          node dist/src/main &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health; then
              echo "\nhealth check passed"
              exit 0
            fi
            sleep 1
          done
          echo "server never became healthy"
          exit 1

  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    env:
      VITE_API_URL: http://localhost:3000/api/v1
      VITE_STRIPE_PUBLIC_KEY: pk_test_ci_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Unit tests
        run: npm test

      # `tsc -b && vite build` — catches unused imports and type errors too.
      - run: npm run build
